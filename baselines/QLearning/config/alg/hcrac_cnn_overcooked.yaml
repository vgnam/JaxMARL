# HC-RAC (CONTRAIL) on Overcooked with the IQL-CNN learner.
# Hyper-parameters above the method block are ql_cnn_overcooked's (IQL-CNN).
#   python baselines/QLearning/rac_cnn_overcooked.py +alg=hcrac_cnn_overcooked
"ALG_NAME": "hcrac_cnn"
"TOTAL_TIMESTEPS": 5e6
"NUM_ENVS": 32
"NUM_STEPS": 1
"BUFFER_SIZE": 1e5
"BUFFER_BATCH_SIZE": 128
"HIDDEN_SIZE": 64
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1
"LEARNING_STARTS": 1e3
"MAX_GRAD_NORM": 1
"TARGET_UPDATE_INTERVAL": 10
"NUM_EPOCHS": 4
"LR": 0.00007
"LR_LINEAR_DECAY": True
"GAMMA": 0.99
"TAU": 1.
"LOSS_TYPE": "vdn"


# HC-RAC, main setting (as PyMARL corac_mate / hcrac_rnn_smax): stationary
# context (fixed return range, EMA encoder, 2 bank pushes), constant KL_WEIGHT and
# RAC's per-action teacher (action_max).
"CONTEXT_LABELER": "corac"
"TWIN_HEAD": "hyper"
"TWIN_HYPER_HIDDEN": 64 # zero-delta hypernetwork width
"TWIN_TARGET_CLAMP": True # bound twin target and teacher by the realisable discounted return
"KL_LOGIT_TEMPERATURE_FRAC": 0.0
"KL_WEIGHT": 0.5 # as rac_cnn_overcooked (untuned here)
"KL_WEIGHT_FINAL": null # null = constant KL_WEIGHT
"TEACHER_CONTEXT_SELECT": "action_max"
"TEACHER_TOPK": 4
"CORAC_USE_RETURN": True
"CORAC_USE_TRAJECTORY": True
"CORAC_N_FREQ": 16 # cosine features of the return
"CORAC_EMBED_DIM": 32 # trajectory embedding (TCL)
# Per-agent episode return of the training reward: 20 per delivered soup for
# both agents plus the annealed shaped reward (cramped_room: a good policy
# delivers ~10 soups in 400 steps). Retune for other layouts.
"CORAC_RETURN_RANGE": [0.0, 300.0]
"CORAC_TARGET_TAU": 0.005 # EMA context encoder
"CORAC_BANK_PUSH": 2 # contexts pushed per labelling once the bank is full
"CORAC_BANK_SIZE": 64 # contexts per agent the teacher maximises over
"CORAC_SEGMENT_LEN": 16 # steps per TCL window (400-step episodes, as the 500-step MATE preset)
"CORAC_HIDDEN_DIM": 64
"CORAC_PROJ_DIM": 32
"CORAC_TEMPERATURE": 0.1
"CORAC_N_HARD": 4 # outcome-swapped negatives per anchor
"CORAC_POOL_SIZE": 4096 # candidate steps for the neighbour search
"CORAC_STAT_MOMENTUM": 0.01 # only used without CORAC_RETURN_RANGE
"CORAC_MIN_STD_FRAC": 0.0
"CORAC_LR": 0.0005
# The CNN learner labels once per 400-step episode (every 400 * NUM_ENVS env
# steps), so 1 TCL step per labelling gives only ~390 encoder updates in 5e6
# steps. 64 steps per labelling gives ~25k, the order of the SMAX / MPE presets.
"CORAC_ENCODER_STEPS": 64

# env
"ENV_NAME": "overcooked"
"ENV_KWARGS": 
  "layout" : "cramped_room"
"REW_SHAPING_HORIZON": 2.5e6

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 400
"TEST_NUM_ENVS": 512 # number of episodes to average over, can affect performance
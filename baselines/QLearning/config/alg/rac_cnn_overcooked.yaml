# RAC on Overcooked with the IQL-CNN learner.
# Hyper-parameters above the method block are ql_cnn_overcooked's (IQL-CNN).
#   python baselines/QLearning/rac_cnn_overcooked.py +alg=rac_cnn_overcooked
"ALG_NAME": "rac_cnn"
"TOTAL_TIMESTEPS": 5e6
"NUM_ENVS": 32
"NUM_STEPS": 1
"BUFFER_SIZE": 1e5
"BUFFER_BATCH_SIZE": 128
"HIDDEN_SIZE": 64
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1
"LEARNING_STARTS": 1e3
"MAX_GRAD_NORM": 1
"TARGET_UPDATE_INTERVAL": 10
"NUM_EPOCHS": 4
"LR": 0.00007
"LR_LINEAR_DECAY": True
"GAMMA": 0.99
"TAU": 1.
"LOSS_TYPE": "vdn"


# RAC
"CONTEXT_LABELER": "return_bins" # one-hot bin of the episode return
"SLOT_NUMBER": 10 # m, number of return bins
# Per-agent episode return of the training reward: 20 per delivered soup for
# both agents plus the annealed shaped reward (cramped_room: a good policy
# delivers ~10 soups in 400 steps). Retune for other layouts.
"RETURN_MIN": 0.0
"RETURN_MAX": 300.0
"TWIN_HEAD": "hyper"
"TWIN_HYPER_HIDDEN": 0 # 0: plain hypernet over the one-hot context
"KL_WEIGHT": 0.5 # beta, as the main MATE protocol (untuned here)
"KL_WEIGHT_FINAL": null # null keeps KL_WEIGHT constant
"TEACHER_CONTEXT_SELECT": "action_max" # max over contexts per action (RAC)
"TEACHER_TOPK": 4
"TWIN_TARGET_CLAMP": False
"KL_LOGIT_TEMPERATURE_FRAC": 0.0

# env
"ENV_NAME": "overcooked"
"ENV_KWARGS": 
  "layout" : "cramped_room"
"REW_SHAPING_HORIZON": 2.5e6

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 400
"TEST_NUM_ENVS": 512 # number of episodes to average over, can affect performance
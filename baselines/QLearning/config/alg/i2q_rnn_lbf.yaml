# I2Q on Level-Based Foraging.
# Hyper-parameters above the method block are ql_rnn_lbf's (IQL).
#   python baselines/QLearning/i2q_rnn.py +alg=i2q_rnn_lbf
"ALG_NAME": "i2q_rnn"
"TOTAL_TIMESTEPS": 2e6
"NUM_ENVS": 8
"NUM_STEPS": 51 # one 50-step episode per env per update
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 64
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1 # percentage of updates (overridden by EPS_DECAY_STEPS)
"EPS_DECAY_STEPS": 50000 # env steps, as PyMARL iql (epsilon_anneal_time)
"MAX_GRAD_NORM": 10 # as PyMARL (grad_norm_clip)
"TARGET_UPDATE_INTERVAL": 25
"TAU": 1.
"NUM_EPOCHS": 8
"LR": 0.0005 # as PyMARL (lr)
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": True
"GAMMA": 0.99
"OPTIMIZER": "radam" # radam (as iql_rnn), adam or rmsprop (RAC paper)

# I2Q (Jiang & Lu, NeurIPS 2022), defaults from the authors' SMAC config.
"I2Q_LAMBDA": 0.2
"I2Q_TAU": 0.52
"I2Q_HIDDEN_DIM": 256

# ENV (as ql_rnn_lbf)
"ENV_NAME": "LBF"
"ENV_KWARGS":
  "num_agents": 2
  "field_size": 8
  "max_num_food": 2
  "sight": null
  "max_episode_steps": 50
  "force_coop": True
  "penalty": 0.0
  "shared_rewards": True

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 51
"TEST_NUM_ENVS": 512 # number of episodes to average over, can affect performance

"LOG_AGENTS_SEPARATELY": False

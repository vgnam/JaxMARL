# RAC on overcooked (same hyper-parameters as ql_rnn_overcooked).
#   python baselines/QLearning/rac_rnn.py +alg=rac_rnn_overcooked
"ALG_NAME": "rac_rnn"
"TOTAL_TIMESTEPS": 1e7
"NUM_ENVS": 16
"NUM_STEPS": 401 # one 400-step episode per env per update
"BUFFER_SIZE": 1000 # episodes; 1000 x 401 steps x 2 agents x 522 floats ~ 1.7 GB
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 256
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1 # percentage of updates
"MAX_GRAD_NORM": 10
"TARGET_UPDATE_INTERVAL": 10
"TAU": 1.
"NUM_EPOCHS": 4
"LR": 0.0001
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": True
"GAMMA": 0.99
"OPTIMIZER": "radam" # as iql_rnn

# RAC
"CONTEXT_LABELER": "return_bins" # one-hot bin of the episode return
"SLOT_NUMBER": 10 # m, number of return bins
# overcooked (400 steps): both agents get 20 per delivered soup (a good
# cramped_room policy delivers ~10), plus the annealed shaped reward.
"RETURN_MIN": 0.0
"RETURN_MAX": 300.0
"TWIN_HEAD": "hyper"
"TWIN_HYPER_HIDDEN": 0 # 0: plain hypernet over the one-hot context
"KL_WEIGHT": 0.5 # beta, as the main MATE protocol (untuned here)
"KL_WEIGHT_FINAL": null # null keeps KL_WEIGHT constant
"KL_ANNEAL_START": 0
"KL_ANNEAL_END": 0
"TEACHER_CONTEXT_SELECT": "action_max" # max over contexts per action (RAC)
"TEACHER_TOPK": 4
"TWIN_TARGET_CLAMP": False
"KL_LOGIT_TEMPERATURE_FRAC": 0.0

# ENV. The 4x5x26 grid observation is flattened by CTRolloutManager (RNN agent
# over a flat vector, unlike iql_cnn_overcooked). info["shaped_reward"] is added
# to the training reward, annealed 1 -> 0 over REW_SHAPING_HORIZON env steps
# (schedules.add_shaped_reward); the logged returns are the sparse soup reward.
"ENV_NAME": "overcooked"
"ENV_KWARGS":
  "layout": "cramped_room"
"REW_SHAPING_HORIZON": 2.5e6

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 401
"TEST_NUM_ENVS": 128 # number of episodes to average over, can affect performance

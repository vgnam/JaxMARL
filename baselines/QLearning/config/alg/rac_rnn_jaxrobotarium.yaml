# RAC on jaxrobotarium (same hyper-parameters as ql_rnn_jaxrobotarium).
#   python baselines/QLearning/rac_rnn.py +alg=rac_rnn_jaxrobotarium
"ALG_NAME": "rac_rnn"
"TOTAL_TIMESTEPS": 3e6
"NUM_ENVS": 8
"NUM_STEPS": 101 # one 100-step episode per env per update
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 256
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1 # percentage of updates
"MAX_GRAD_NORM": 25
"TARGET_UPDATE_INTERVAL": 200
"TAU": 1.
"NUM_EPOCHS": 1
"LR": 0.005
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": True
"GAMMA": 0.9
"OPTIMIZER": "radam" # as iql_rnn

# RAC
"CONTEXT_LABELER": "return_bins" # one-hot bin of the episode return
"SLOT_NUMBER": 10 # m, number of return bins
# navigation (100 steps): -distance to goal each step, 0 at the goal. A random
# policy scores ~[-240, -41] per agent.
"RETURN_MIN": -240.0
"RETURN_MAX": 0.0
"TWIN_HEAD": "hyper"
"TWIN_HYPER_HIDDEN": 0 # 0: plain hypernet over the one-hot context
"KL_WEIGHT": 0.5 # beta, as the main MATE protocol (untuned here)
"KL_WEIGHT_FINAL": null # null keeps KL_WEIGHT constant
"KL_ANNEAL_START": 0
"KL_ANNEAL_END": 0
"TEACHER_CONTEXT_SELECT": "action_max" # max over contexts per action (RAC)
"TEACHER_TOPK": 4
"TWIN_TARGET_CLAMP": False
"KL_LOGIT_TEMPERATURE_FRAC": 0.0

# ENV (as ql_rnn_jaxrobotarium). Other scenarios (discovery, warehouse, rware,
# predator_prey, foraging, material_transport) need their own ENV_KWARGS and
# return range. Needs the jaxrobotarium submodule:
#   git submodule update --init --recursive jaxmarl/environments/robotarium
#   pip install -e jaxmarl/environments/robotarium #       -e jaxmarl/environments/robotarium/jaxrobotarium/robotarium_python_simulator jaxopt
"ENV_NAME": "JaxRobotarium_navigation"
"ENV_KWARGS": {
  "num_agents": 3,
  "max_steps": 100,
  "action_type": "Discrete",
  "robotarium": {
    "number_of_robots": 3,
    "show_figure": False,
    "sim_in_real_time": False,
  },
  "controller": {
    "controller": "clf_uni_position",
    "barrier_fn": "robust_barriers",
  },
  "update_frequency": 30
}

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 101
"TEST_NUM_ENVS": 64 # number of episodes to average over, can affect performance

"LOG_AGENTS_SEPARATELY": True # as ql_rnn_jaxrobotarium

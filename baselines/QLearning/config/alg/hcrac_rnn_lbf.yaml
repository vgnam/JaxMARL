# HC-RAC (CONTRAIL) on Level-Based Foraging, main setting (as PyMARL corac_mate /
# hcrac_rnn_smax): stationary context (fixed return range, EMA encoder, 2 bank
# pushes), constant KL_WEIGHT and RAC's per-action teacher (action_max).
# Hyper-parameters above the method block are ql_rnn_lbf's (IQL).
#   python baselines/QLearning/rac_rnn.py +alg=hcrac_rnn_lbf
"ALG_NAME": "hcrac_rnn"
"TOTAL_TIMESTEPS": 2e6
"NUM_ENVS": 8
"NUM_STEPS": 51 # one 50-step episode per env per update
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 64
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1 # percentage of updates (overridden by EPS_DECAY_STEPS)
"EPS_DECAY_STEPS": 50000 # env steps, as PyMARL iql (epsilon_anneal_time)
"MAX_GRAD_NORM": 10 # as PyMARL (grad_norm_clip)
"TARGET_UPDATE_INTERVAL": 25
"TAU": 1.
"NUM_EPOCHS": 8
"LR": 0.0005 # as PyMARL (lr)
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": True
"GAMMA": 0.99
"OPTIMIZER": "radam" # radam (as iql_rnn), adam or rmsprop (RAC paper)

# HC-RAC
"CONTEXT_LABELER": "corac" # continuous contexts instead of RAC's one-hot bins
"TWIN_HEAD": "hyper"
"TWIN_HYPER_HIDDEN": 64 # zero-delta hypernetwork width
"TWIN_TARGET_CLAMP": True # bound twin target and teacher by the realisable discounted return
"KL_LOGIT_TEMPERATURE_FRAC": 0.0
"KL_WEIGHT": 0.5 # as rac_rnn_lbf (untuned here)
"KL_WEIGHT_FINAL": null # null = constant KL_WEIGHT
"KL_ANNEAL_START": 0
"KL_ANNEAL_END": 0
"TEACHER_CONTEXT_SELECT": "action_max"
"TEACHER_TOPK": 4
# context c = [phi(R) ; u]
"CORAC_USE_RETURN": True
"CORAC_USE_TRAJECTORY": True
"CORAC_N_FREQ": 16 # cosine features of the return
"CORAC_EMBED_DIM": 32 # trajectory embedding (TCL)
# Normalised team reward: every LBF episode return is in [0, 1] (1 = all food).
"CORAC_RETURN_RANGE": [0.0, 1.0]
"CORAC_TARGET_TAU": 0.005 # EMA context encoder
"CORAC_BANK_PUSH": 2 # contexts pushed per update once the bank is full
"CORAC_BANK_SIZE": 64 # contexts per agent the teacher maximises over
"CORAC_SEGMENT_LEN": 5 # steps per TCL window
"CORAC_HIDDEN_DIM": 64
"CORAC_PROJ_DIM": 32
"CORAC_TEMPERATURE": 0.1
"CORAC_N_HARD": 4 # outcome-swapped negatives per anchor
"CORAC_POOL_SIZE": 4096 # candidate steps for the neighbour search
"CORAC_STAT_MOMENTUM": 0.01 # only used without CORAC_RETURN_RANGE
"CORAC_MIN_STD_FRAC": 0.0
"CORAC_LR": 0.0005

# ENV (as ql_rnn_lbf)
"ENV_NAME": "LBF"
"ENV_KWARGS":
  "num_agents": 2
  "field_size": 8
  "max_num_food": 2
  "sight": null
  "max_episode_steps": 50
  "force_coop": True
  "penalty": 0.0
  "shared_rewards": True

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 51
"TEST_NUM_ENVS": 512 # number of episodes to average over, can affect performance

"LOG_AGENTS_SEPARATELY": False

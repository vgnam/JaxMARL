# IQL (iql_rnn.py) on the cooperative matrix games (default: climbing, one shot).
#   python baselines/QLearning/iql_rnn.py +alg=ql_rnn_matrix
#   python baselines/QLearning/iql_rnn.py +alg=ql_rnn_matrix alg.ENV_KWARGS.game=penalty
# JaxMARL ships no matrix-game preset: PyMARL's IQL settings (5e4 one-step
# episodes, epsilon annealed over the whole run). Climbing optimum (0, 0) = 11;
# independent learners usually settle on 7 or 5 (relative overgeneralisation).
"TOTAL_TIMESTEPS": 1e5 # 8 one-step episodes per update: 5e4 episodes, as PyMARL's t_max 5e4
"NUM_ENVS": 8
"NUM_STEPS": 2 # one 1-step episode per env per update (+ the reset step): episode_limit + 1
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 64
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1 # percentage of updates (overridden by EPS_DECAY_STEPS)
"EPS_DECAY_STEPS": 1e5 # PyMARL anneals epsilon over the whole run (5e4 steps = episodes)
"MAX_GRAD_NORM": 10
"TARGET_UPDATE_INTERVAL": 25 # updates (x 8 episodes = 200 episodes)
"TAU": 1.
"NUM_EPOCHS": 8 # one batch per collected episode
"LR": 0.0005
"LEARNING_STARTS": 1000 # timesteps
"LR_LINEAR_DECAY": True
"GAMMA": 0.99
"MIXER_EMBEDDING_DIM": 32 # just for qmix
"MIXER_HYPERNET_HIDDEN_DIM": 128 # just for qmix
"MIXER_INIT_SCALE": 0.001 # just for qmix

# ENV: game in {climbing, penalty, partially_stochastic_climbing,
# fully_stochastic_climbing}. episode_limit > 1 repeats the game; then set
# NUM_STEPS and TEST_NUM_STEPS to episode_limit + 1 and scale the return range.
"ENV_NAME": "MatrixGame"
"ENV_KWARGS":
  "game": "climbing"
  "episode_limit": 1
  "penalty_k": -15.0

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.02
"TEST_NUM_STEPS": 2
"TEST_NUM_ENVS": 128

"LOG_AGENTS_SEPARATELY": False

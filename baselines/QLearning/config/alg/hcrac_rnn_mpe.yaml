# HC-RAC (CONTRAIL), main setting (as PyMARL corac_mate / hcrac_rnn_smax):
#   A  stationary context: fixed return range, EMA context encoder, 2 bank pushes,
#      constant KL_WEIGHT and RAC's per-action teacher (action_max)
# Ladder steps B (KL anneal) and C (context_argmax) are off since 2026-11-20.
# Re-enable with alg.KL_WEIGHT_FINAL=0.0 alg.KL_ANNEAL_START=50000
# alg.KL_ANNEAL_END=250000 alg.TEACHER_CONTEXT_SELECT=context_argmax.
# The twin reads c = [phi(R) ; u] (cosine features of the return + a trajectory
# contrastive embedding) through a zero-delta hypernetwork; the teacher maximises
# over a bank of recent contexts. Execution is IQL's.
#   python baselines/QLearning/rac_rnn.py +alg=hcrac_rnn_mpe
"ALG_NAME": "hcrac_rnn"
"TOTAL_TIMESTEPS": 1e7
"NUM_ENVS": 8
"NUM_STEPS": 26
"BUFFER_SIZE": 5000
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 64
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.1 # percentage of updates
"MAX_GRAD_NORM": 25
"TARGET_UPDATE_INTERVAL": 200
"TAU": 1.
"NUM_EPOCHS": 1
"LR": 0.005
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": True
"GAMMA": 0.9
"OPTIMIZER": "radam" # radam (as iql_rnn), adam or rmsprop (RAC paper)

# HC-RAC
"CONTEXT_LABELER": "corac" # continuous contexts instead of RAC's one-hot bins
"TWIN_HEAD": "hyper"
"TWIN_HYPER_HIDDEN": 64 # zero-delta hypernetwork width
"TWIN_TARGET_CLAMP": True # bound twin target and teacher by the realisable discounted return
"KL_LOGIT_TEMPERATURE_FRAC": 0.0
# constant KL weight (no anneal), same as RAC
"KL_WEIGHT": 1.0
"KL_WEIGHT_FINAL": null # null = constant KL_WEIGHT
"KL_ANNEAL_START": 0
"KL_ANNEAL_END": 0
# RAC's teacher: per-action max over the context bank (C would be context_argmax)
"TEACHER_CONTEXT_SELECT": "action_max"
"TEACHER_TOPK": 4
# context c = [phi(R) ; u]
"CORAC_USE_RETURN": True
"CORAC_USE_TRAJECTORY": True
"CORAC_N_FREQ": 16 # cosine features of the return
"CORAC_EMBED_DIM": 32 # trajectory embedding (TCL)
# A: stationary context. Per-agent episode return range, as RAC_RETURN_MIN/MAX.
"CORAC_RETURN_RANGE": [-60.0, 0.0]
"CORAC_TARGET_TAU": 0.005 # EMA context encoder
"CORAC_BANK_PUSH": 2 # contexts pushed per update once the bank is full
"CORAC_BANK_SIZE": 64 # contexts per agent the teacher maximises over
"CORAC_SEGMENT_LEN": 5 # steps per TCL window
"CORAC_HIDDEN_DIM": 64
"CORAC_PROJ_DIM": 32
"CORAC_TEMPERATURE": 0.1
"CORAC_N_HARD": 4 # outcome-swapped negatives per anchor
"CORAC_POOL_SIZE": 4096 # candidate steps for the neighbour search
"CORAC_STAT_MOMENTUM": 0.01 # only used without CORAC_RETURN_RANGE
"CORAC_MIN_STD_FRAC": 0.0
"CORAC_LR": 0.0005

# ENV
"ENV_NAME": "MPE_simple_spread_v3"
"ENV_KWARGS": {}

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates, i.e. log every 5% of training process
"TEST_NUM_STEPS": 30
"TEST_NUM_ENVS": 512 # number of episodes to average over, can affect performance

"LOG_AGENTS_SEPARATELY": True
